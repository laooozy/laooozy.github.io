el="标签" data-astro-cid-yxuvvj2t><li data-astro-cid-yxuvvj2t><a href="/zh-hans/blog/tags/%E8%A8%AD%E8%A8%88/" data-astro-cid-ags4ogmk="true" class="chip chip--tag">設計</a></li><li data-astro-cid-yxuvvj2t><a href="/zh-hans/blog/tags/%E9%9A%A8%E7%AD%86/" data-astro-cid-ags4ogmk="true" class="chip chip--tag">隨筆</a></li></ul></header><div class="post__body" data-astro-cid-hl2gzuic><p>把背景壓暗，不是為了看起來帥，而是為了讓內容自己發光。</p>
<h2 id="留白是節奏">留白是節奏</h2>
<p>一份文件如果每寸都被填滿，讀者的眼睛沒有地方休息。
我習慣在段落之間留下比「剛好」再多一點的空間。</p>
<h2 id="顏色要少">顏色要少</h2>
<p>一個強調色就夠了。同一個紫色用在不同深淺上，
比塞進五顏六色更能讓人記得這個網站的樣子。</p>
<p>安靜的設計，其實是一種替讀者著想的設計。</p>
