name: Music data

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      playlist:
        description: "Test-only playlist URL override (failure testing)"
        required: false
        type: string
      yt_dlp_version:
        description: "Pinned yt-dlp release tag to download and verify"
        required: false
        default: "2026.10.26"
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/music/**"
      - ".github/workflows/music.yml"

permissions:
  contents: write

concurrency:
  group: music-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned yt-dlp
        env:
          YT_DLP_VERSION: ${{ inputs.yt_dlp_version || '2026.10.26' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o yt-dlp_linux "https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/yt-dlp_linux"
          curl -fsSL -o SHA2-256SUMS "https://github.com/yt-dlp/yt-dlp/releases/download/${YT_DLP_VERSION}/SHA2-256SUMS"
          grep -E '  yt-dlp_linux$' SHA2-256SUMS | sha256sum -c -
          chmod +x yt-dlp_linux
          mv yt-dlp_linux yt-dlp
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yt-dlp" --version
      - name: Build the payload
        env:
          PLAYLIST_OVERRIDE: ${{ inputs.playlist }}
        run: |
          if [ -n "$PLAYLIST_OVERRIDE" ]; then
            node scripts/music/fetch.mjs --playlist "$PLAYLIST_OVERRIDE"
          else
            node scripts/music/fetch.mjs
          fi
      - name: Publish data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd .music-out
          git init -q -b music_asset
          git add music.json.gz
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore(music): refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'
          git push --force origin music_asset
